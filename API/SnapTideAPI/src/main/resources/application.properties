# App name
spring.application.name=api

# Server port
server.port=${SERVER_PORT:8080}

# Context path
server.servlet.context-path=/api

# Restart WAS
spring.devtools.livereload.enabled=true

# Spring Datasource (values injected via environment variables — see .env.example)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/db7}
spring.datasource.username=${DB_USERNAME:db7}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# File upload (storage dir is created automatically; cross-platform default)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.max-file-size=10MB
com.example.upload.path=${UPLOAD_PATH:${user.home}/snaptide-uploads}

# JWT (secret MUST be provided via environment variable in real deployments)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
jwt.expiration-minutes=${JWT_EXPIRE_MINUTES:43200}

# log level ALL < DEBUG < INFO < WARN < ERROR < FATAL < OFF
logging.level.org.springframework.security.web=trace
logging.level.com.example=debug
